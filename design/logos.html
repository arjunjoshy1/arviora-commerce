<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arviora — AV / Swoosh Logo Concepts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: #F4F4F2; color: #1C1C1A; padding: 48px 24px; }
  h1 { font-family: Poppins; font-size: 26px; margin-bottom: 4px; }
  .sub { color: #8A8A85; margin-bottom: 36px; max-width: 640px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px; max-width: 1150px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #E6E5E1; border-radius: 18px; padding: 30px; }
  .num { font-size: 12px; color: #8A8A85; margin-bottom: 22px; font-weight: 600; letter-spacing: .04em; }
  .row { display: flex; align-items: center; gap: 14px; min-height: 64px; }
  .wm { font-family: Poppins; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; position: relative; display: inline-block; }
  .wm-lower { text-transform: lowercase; }
  .tile { background: #1C1C1A; color: #fff; border-radius: 14px; width: 52px; height: 52px; display: grid; place-items: center; flex: none; }
  .caption { margin-top: 18px; font-size: 13px; color: #8A8A85; }
  .dark { margin-top: 16px; background: #1C1C1A; border-radius: 12px; padding: 16px 18px; display: flex; align-items: center; gap: 12px; }
  .dark .wm { color: #F4F4F2; font-size: 22px; }
  .dark .tile { background: #fff; color: #1C1C1A; width: 38px; height: 38px; border-radius: 10px; }
  .dark svg .swoosh { stroke: #F4F4F2; }
  .swooshwrap { position: relative; display: inline-block; padding-bottom: 14px; }
  .swooshsvg { position: absolute; left: 0; bottom: 0; width: 100%; height: 16px; overflow: visible; }
</style>
</head>
<body>
  <h1>Arviora — AV &amp; Swoosh Concepts</h1>
  <p class="sub">Amazon-style: a clean wordmark with a curved "smile" swoosh, plus interlocking <b>AV</b> monogram marks. Each shown as a tile mark and on a dark strip. Tell me a number (mix &amp; match welcome).</p>
  <div class="grid" id="grid"></div>

<script>
const av = (inner) => `<svg viewBox="0 0 28 28" width="30" height="30" fill="none">${inner}</svg>`;

// AV monograms (letters allowed, but stylized into a mark)
const marks = {
  // 1. A over V sharing diagonals -> diamond/gem hourglass
  diamond: av('<path d="M5 7h18l-9 14L5 7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 7 14 14l4.5-7" stroke="currentColor" stroke-width="1.5"/>'),
  // 2. A (chevron up) above V (chevron down) -> stacked, reads AV / gem facet
  stacked: av('<path d="M6 12 14 5l8 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 16l8 7 8-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'),
  // 3. AV ligature forming an upward arrow (growth)
  arrow: av('<path d="M14 5 5 22h5l4-8 4 8h5L14 5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M11 17h6" stroke="currentColor" stroke-width="1.6"/>'),
  // 4. Rounded A+V as a continuous ribbon
  ribbon: av('<path d="M6 21 12.5 6a1.6 1.6 0 0 1 3 0L22 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M14 21 17 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'),
};

// Reusable swoosh under a wordmark (Amazon-style smile that ends in an arrow tick)
function swoosh(id) {
  return `<span class="swooshwrap">arviora<svg class="swooshsvg" viewBox="0 0 200 16" preserveAspectRatio="none">
    <path class="swoosh" d="M6 4 C 60 18, 150 18, 196 5" stroke="#1C1C1A" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path class="swoosh" d="M196 5 l -7 -1 m 7 1 l -2 7" stroke="#1C1C1A" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  </svg></span>`;
}

const logos = [
  { n:1, type:'mark', key:'stacked', name:'AV stacked chevrons — reads A over V, also a gem facet' },
  { n:2, type:'mark', key:'diamond', name:'AV diamond — A & V sharing diagonals into a gem' },
  { n:3, type:'mark', key:'arrow',   name:'AV upward arrow — letters merge into a growth arrow' },
  { n:4, type:'mark', key:'ribbon',  name:'AV ribbon — soft continuous A+V stroke' },
  { n:5, type:'swoosh', name:'Wordmark + smile swoosh (Amazon-style), no icon' },
  { n:6, type:'swoosh+mark', key:'stacked', name:'AV mark + swoosh wordmark together' },
];

document.getElementById('grid').innerHTML = logos.map(l => {
  let light, dark;
  if (l.type === 'mark') {
    const m = marks[l.key];
    light = `<span class="tile">${m}</span><span class="wm">Arviora</span>`;
    dark  = `<span class="tile">${m}</span><span class="wm">Arviora</span>`;
  } else if (l.type === 'swoosh') {
    light = `<span class="wm wm-lower">${swoosh()}</span>`;
    dark  = `<span class="wm wm-lower">${swoosh()}</span>`;
  } else {
    const m = marks[l.key];
    light = `<span class="tile">${m}</span><span class="wm wm-lower">${swoosh()}</span>`;
    dark  = `<span class="tile">${m}</span><span class="wm wm-lower">${swoosh()}</span>`;
  }
  return `<div class="card">
    <div class="num">OPTION ${l.n}</div>
    <div class="row">${light}</div>
    <div class="dark">${dark}</div>
    <div class="caption">${l.name}</div>
  </div>`;
}).join('');
</script>
</body>
</html>
